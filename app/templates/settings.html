{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block body %}
<h1>Settings</h1>
<p>GPU utilization is not the same thing as VRAM allocation. These numbers shape the launch plan. They are not a hard ceiling inside the driver.</p>
<form class="stack" action="/settings" method="post">
  <label>Context tokens <input name="context_tokens" type="number" value="{{ settings.context_tokens }}"></label>
  <label>VRAM budget MB <input name="vram_budget_mb" type="number" value="{{ settings.vram_budget_mb }}"></label>
  <label>VRAM reserve MB <input name="vram_reserve_mb" type="number" value="{{ settings.vram_reserve_mb }}"></label>
  <label>CPU limit percent <input name="cpu_limit_percent" type="number" value="{{ settings.cpu_limit_percent }}"></label>
  <label>Writing temperature <input name="temperature_write" type="number" step="0.1" value="{{ settings.temperature_write }}"></label>
  <label>Scene word target <input name="scene_target_words" type="number" value="{{ settings.scene_target_words }}"></label>
  <label>Cooldown seconds <input name="cooldown_seconds" type="number" step="0.5" value="{{ settings.cooldown_seconds }}"></label>
  <label>Active model
    <select name="active_model">
      <option {% if settings.active_model == "qwen3-8b-q4" %}selected{% endif %}>qwen3-8b-q4</option>
      <option {% if settings.active_model == "qwen3-4b-q4" %}selected{% endif %}>qwen3-4b-q4</option>
    </select>
  </label>
  <label>Planner
    <select name="planner_mode">
      <option {% if settings.planner_mode == "deterministic" %}selected{% endif %}>deterministic</option>
      <option {% if settings.planner_mode == "llm" %}selected{% endif %}>llm</option>
    </select>
  </label>
  <label>Inference
    <select name="inference_backend">
      <option {% if settings.inference_backend == "llama" %}selected{% endif %}>llama</option>
      <option {% if settings.inference_backend == "mock" %}selected{% endif %}>mock</option>
    </select>
  </label>
  <button type="submit">Save</button>
</form>
{% endblock %}
